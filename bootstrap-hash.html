<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Password Hash Generator (local only)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #1e293b; }
  h1 { font-size: 18px; }
  p { color: #475569; font-size: 14px; line-height: 1.5; }
  input, textarea { width: 100%; padding: 10px; margin: 6px 0 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  textarea { font-family: monospace; height: 80px; background: #f8fafc; }
  .note { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; padding: 12px; font-size: 13px; }
</style>
</head>
<body>
  <h1>🔒 Local Password Hash Generator</h1>
  <p class="note">Runs 100% in your browser — nothing is sent anywhere. Use this to create the first admin account's hash for the D1 <code>users</code> table. Same PBKDF2-SHA256 algorithm as the Worker.</p>

  <label>Username</label>
  <input id="username" placeholder="LIO">

  <label>Password</label>
  <input id="password" type="text" placeholder="type the real password here">

  <label>Email (optional)</label>
  <input id="email" placeholder="admin@bbcac.co">

  <button onclick="generate()">Generate SQL INSERT</button>

  <h3>Paste this into the D1 Console:</h3>
  <textarea id="output" readonly placeholder="SQL will appear here..."></textarea>

  <script>
    async function pbkdf2(password, salt) {
      const keyMaterial = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, 256);
      return new Uint8Array(bits);
    }
    function bufToHex(buf) { return Array.from(buf).map(b => b.toString(16).padStart(2, "0")).join(""); }

    async function generate() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const email = document.getElementById('email').value.trim();
      if (!username || !password) { alert("Fill in username and password."); return; }

      const salt = crypto.getRandomValues(new Uint8Array(16));
      const hash = await pbkdf2(password, salt);
      const stored = bufToHex(salt) + ":" + bufToHex(hash);

      const sql = "INSERT INTO users (username, password_hash, email, permissions) VALUES ('" +
        username.replace(/'/g, "''") + "', '" + stored + "', '" + email.replace(/'/g, "''") +
        "', '[\"Super Admin\"]');";

      document.getElementById('output').value = sql;
    }
  </script>
</body>
</html>
